services:
  # PostgreSQL Database Server
  postgres:
    image: postgres:15-alpine
    container_name: jobmatix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobmatix_user
      POSTGRES_PASSWORD: JobMatix2026!Dev
      POSTGRES_DB: jobmatix_main
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - jobmatix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatix_user -d jobmatix_main"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin - Web-based PostgreSQL Administration
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jobmatix-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - jobmatix-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  jobmatix-network:
    driver: bridge
